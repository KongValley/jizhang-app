<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>记账本 · 每天记一笔</title>
    <meta name="description" content="纯本地记账 App：快速记账、分类统计、预算提醒，数据只保存在你自己的设备上。" />
    <meta name="theme-color" content="#f2f3f7" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="记账本" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      try {
        var raw = localStorage.getItem('jizhang.data.v1');
        var mode = raw ? (JSON.parse(raw).settings || {}).theme : 'auto';
        var dark =
          mode === 'dark' ||
          ((!mode || mode === 'auto') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
